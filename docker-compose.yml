services:
  postgres:
    image: postgres:16-alpine
    container_name: orions-frontier-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orions-frontier-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: orions-frontier-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      API_PORT: 3000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm --filter @orions-frontier/api dev

  websocket:
    build:
      context: .
      dockerfile: ./apps/websocket/Dockerfile
    container_name: orions-frontier-websocket
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      WS_PORT: 3001
      WS_HOST: 0.0.0.0
    volumes:
      - ./apps/websocket/src:/app/apps/websocket/src
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/websocket/node_modules
    command: pnpm --filter @orions-frontier/websocket dev

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: orions-frontier-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3001
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/index.html:/app/apps/frontend/index.html
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/frontend/node_modules
    command: pnpm --filter @orions-frontier/frontend dev
    depends_on:
      - api
      - websocket

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orionsfrontier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set a password}
      POSTGRES_DB: ${POSTGRES_DB:-orionsfrontier}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orionsfrontier}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      - sh
      - -c
      - |
        npm run build:packages
        npm run dev --workspace @orions-frontier/shared &
        npm run dev --workspace @orions-frontier/game-config &
        exec npm run dev --workspace @orions-frontier/api
    environment:
      NODE_ENV: development
      API_PORT: 3000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-orionsfrontier}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orionsfrontier}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/game-config/src:/app/packages/game-config/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command:
      - sh
      - -c
      - |
        npm run build:packages
        npm run dev --workspace @orions-frontier/shared &
        npm run dev --workspace @orions-frontier/game-config &
        exec npm run dev --workspace @orions-frontier/frontend
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}
      VITE_WS_URL: ws://localhost:${API_PORT:-3000}
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5173}:5173'
    volumes:
      - ./apps/frontend/src:/app/apps/frontend/src
      - ./apps/frontend/public:/app/apps/frontend/public
      - ./apps/frontend/index.html:/app/apps/frontend/index.html
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/game-config/src:/app/packages/game-config/src
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:

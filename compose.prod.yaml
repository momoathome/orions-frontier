# Production stack. Shares the host with other services: only Caddy publishes ports, and the limits
# keep CPU and memory free for them. Docker-published ports bypass ufw.
name: orions-frontier-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  api:
    image: ghcr.io/momoathome/orions-frontier-api:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?}
      WORLD_SEED: ${WORLD_SEED:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGIN: https://${DOMAIN:?}
      # Caddy is the only hop; it replaces any client-sent X-Forwarded-For.
      TRUST_PROXY: '1'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 5
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  web:
    image: ghcr.io/momoathome/orions-frontier-web:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
